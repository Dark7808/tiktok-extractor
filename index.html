<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Share Link Extractor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #fe2c55;
            --accent-hover: #e02447;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }
        
        .header { text-align: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .header h1 { font-size: 20px; color: var(--text-main); }
        .header h1 span { color: var(--accent-color); font-weight: 800; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 18px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .card h2 { font-size: 15px; margin-bottom: 10px; color: var(--text-main); }

        textarea, input[type="text"] { width: 100%; padding: 12px; background: #0b1120; color: #38bdf8; border-radius: 8px; border: 1px solid var(--border-color); font-family: monospace; font-size: 13px; margin-bottom: 12px; outline: none; }
        textarea { height: 110px; resize: vertical; }
        textarea:focus, input[type="text"]:focus { border-color: var(--accent-color); }

        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
        .control-item { display: flex; flex-direction: column; gap: 5px; }
        .control-item label { font-size: 12px; color: var(--text-sub); font-weight: 600; }
        select { padding: 9px; border-radius: 6px; border: 1px solid var(--border-color); background: #0b1120; color: #fff; font-size: 13px; outline: none; }

        .btn-main { background: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s ease; width: 100%; }
        .btn-main:hover { background: var(--accent-hover); }

        .output-textarea { height: 260px; color: var(--success); }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn-sec { flex: 1; min-width: 100px; background: #2563eb; color: #fff; border: none; padding: 9px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }
        .btn-sec:hover { background: #1d4ed8; }
        .btn-clear { background: #475569; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔗 TikTok Share Link Extractor</h1>
    </div>

    <!-- Mode 1: Keyword/Category Search -->
    <div class="card">
        <h2>🔥 ক্যাটেগরি বা কিওয়ার্ড থেকে লিংক সংগ্রহ করুন</h2>
        <input type="text" id="keywordInput" placeholder="যেমন: trending, foryou, viral, funny">
        
        <div class="controls-grid">
            <div class="control-item">
                <label>কয়টি ভিডিওর লিংক চাচ্ছেন?</label>
                <select id="keywordLimit">
                    <option value="30">৩০ টি</option>
                    <option value="50" selected>৫০ টি</option>
                    <option value="100">১০০ টি</option>
                    <option value="500">৫০০ টি</option>
                </select>
            </div>
        </div>
        <button class="btn-main" onclick="scrapeByKeyword()">🔍 শেয়ার লিংক এক্সট্র্যাক্ট করুন</button>
    </div>

    <!-- Mode 2: Single/Bulk Link Resolver -->
    <div class="card">
        <h2>📥 শর্ট লিংক বা ভিডিও লিংক পেস্ট করুন</h2>
        <textarea id="rawInput" placeholder="এখানে টিকটক লিংক দিন... (যেমন: https://vt.tiktok.com/ZSgP1t5sM/)"></textarea>
        <button class="btn-main" onclick="startExtraction()">🚀 লিংক কনভার্ট করুন</button>
    </div>

    <!-- Output Card -->
    <div class="card">
        <h2>📤 আউটপুট শেয়ার লিংক <span style="font-size:12px; color:var(--text-sub);">মোট: <b id="outputCount" style="color:var(--success);">0</b></span></h2>
        <textarea id="outputArea" class="output-textarea" readonly placeholder="শুধু টিকটক শেয়ার লিংক এখানে লাইন বাই লাইন দেখাবে..."></textarea>
        
        <div class="btn-group">
            <button class="btn-sec" onclick="copyOutput()">📋 কপি করুন</button>
            <button class="btn-sec" onclick="downloadTxt()">📄 Download TXT</button>
            <button class="btn-sec btn-clear" onclick="clearAll()">🗑️ ক্লিয়ার</button>
        </div>
    </div>
</div>

<script>
let extractedResults = new Set();

async function scrapeByKeyword() {
    let keyword = document.getElementById('keywordInput').value.trim();
    if (!keyword) keyword = "trending";
    const limit = parseInt(document.getElementById('keywordLimit').value);

    document.getElementById('outputArea').value = "লিংক সংগ্রহ করা হচ্ছে... অপেক্ষা করুন।";
    
    try {
        let cursor = 0;
        let countFetched = 0;
        extractedResults.clear();

        while (countFetched < limit) {
            const targetUrl = `https://www.tikwm.com/api/feed/search?keywords=${encodeURIComponent(keyword)}&count=50&cursor=${cursor}`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
            
            const res = await fetch(proxyUrl);
            const json = await res.json();

            if (json && json.data && json.data.videos && json.data.videos.length > 0) {
                for (const vid of json.data.videos) {
                    if (vid.author && vid.author.unique_id && vid.video_id) {
                        const shareUrl = `https://www.tiktok.com/@${vid.author.unique_id}/video/${vid.video_id}`;
                        extractedResults.add(shareUrl);
                        countFetched++;
                        if (countFetched >= limit) break;
                    }
                }
                cursor += 50;
            } else {
                break;
            }
        }

        renderOutput();
        if(extractedResults.size === 0) {
            alert("কোনো ভিডিও পাওয়া যায়নি, অন্য কিওয়ার্ড দিয়ে চেষ্টা করুন।");
        }
    } {
        // catch block handled
    } catch (e) {
        alert("ত্রুটি হয়েছে: " + e.message);
    }
}

function extractUrls(text) {
    const pattern = /(https?:\/\/(?:www\.|vt\.|vm\.|t\.)?tiktok\.com\/[^\s"'>]+)/gi;
    const matches = text.match(pattern) || [];
    return Array.from(new Set(matches.map(u => u.replace(/[;,.>)]+$/, ''))));
}

async function startExtraction() {
    const rawText = document.getElementById('rawInput').value;
    const urls = extractUrls(rawText);

    if (urls.length === 0) {
        alert("কোনো সঠিক টিকটক লিংক পাওয়া যায়নি!");
        return;
    }

    document.getElementById('outputArea').value = "লিংক প্রসেস হচ্ছে...";

    for (let i = 0; i < urls.length; i++) {
        try {
            const targetUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(urls[i])}`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
            
            const res = await fetch(proxyUrl);
            const json = await res.json();

            if (json && json.data) {
                const username = json.data.author?.unique_id || 'user';
                const shareUrl = `https://www.tiktok.com/@${username}/video/${json.data.id}`;
                extractedResults.add(shareUrl);
            }
        } catch (e) {
            console.error(e);
        }
        renderOutput();
    }
}

function renderOutput() {
    const arr = Array.from(extractedResults);
    document.getElementById('outputArea').value = arr.join('\n');
    document.getElementById('outputCount').innerText = arr.length;
}

function copyOutput() {
    const area = document.getElementById('outputArea');
    if (!area.value) return alert("কপি করার কিছু নেই!");
    area.select();
    document.execCommand("copy");
    alert("শেয়ার লিংকগুলো কপি করা হয়েছে!");
}

function downloadTxt() {
    const area = document.getElementById('outputArea');
    if (!area.value) return alert("ডাউনলোড করার মতো কিছু নেই!");
    const blob = new Blob([area.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tiktok_share_links_${Date.now()}.txt`;
    a.click();
}

function clearAll() {
    extractedResults.clear();
    document.getElementById('keywordInput').value = '';
    document.getElementById('rawInput').value = '';
    document.getElementById('outputArea').value = '';
    document.getElementById('outputCount').innerText = '0';
}
</script>

</body>
</html>
