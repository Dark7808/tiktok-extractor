<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Bulk TikTok Extractor & Related Video Scraper</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #fe2c55;
            --accent-hover: #e02447;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
        
        .header { text-align: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); }
        .header h1 { font-size: 26px; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header h1 span { color: var(--accent-color); font-weight: 800; }
        .badge { background: var(--accent-color); font-size: 12px; padding: 2px 8px; border-radius: 12px; color: #fff; font-weight: bold; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .card h2 { font-size: 18px; margin-bottom: 15px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }

        .info-box { background: rgba(254, 44, 85, 0.1); border-left: 4px solid var(--accent-color); padding: 10px 15px; border-radius: 4px; font-size: 13px; color: var(--text-sub); margin-bottom: 15px; }

        textarea { width: 100%; height: 140px; background: #0b1120; color: #38bdf8; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); font-family: monospace; font-size: 13px; resize: vertical; margin-bottom: 15px; outline: none; }
        textarea:focus { border-color: var(--accent-color); }

        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .control-item { display: flex; flex-direction: column; gap: 6px; }
        .control-item label { font-size: 13px; color: var(--text-sub); font-weight: 600; }
        
        select, input[type="number"] { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: #0b1120; color: #fff; font-size: 14px; outline: none; }

        .btn-main { background: var(--accent-color); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s ease; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-main:hover { background: var(--accent-hover); }
        .btn-main:disabled { background: #475569; cursor: not-allowed; }

        /* Progress Stats Bar */
        .progress-section { margin-top: 15px; display: none; }
        .progress-bar-container { width: 100%; height: 8px; background: #0b1120; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        .progress-bar { height: 100%; width: 0%; background: var(--accent-color); transition: width 0.3s; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; background: #0b1120; padding: 10px; border-radius: 8px; text-align: center; font-size: 12px; }
        .stat-val { font-size: 15px; font-weight: bold; margin-top: 2px; }
        .stat-total { color: #38bdf8; }
        .stat-success { color: var(--success); }
        .stat-skip { color: #f59e0b; }
        .stat-error { color: var(--error); }
        .stat-rate { color: #a855f7; }

        /* Output Area */
        .output-textarea { height: 280px; color: var(--success); }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .btn-secondary { flex: 1; min-width: 120px; background: #2563eb; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; text-align: center; }
        .btn-secondary:hover { background: #1d4ed8; }
        .btn-clear { background: #475569; }
        .btn-clear:hover { background: #334155; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📦 Bulk TikTok Extractor <span>TURBO</span> <span class="badge">v2.0</span></h1>
    </div>

    <!-- Input Card -->
    <div class="card">
        <h2>📥 ইনপুট ডেটা (Auto-Discover)</h2>
        <div class="info-box">
            <b>যেকোনো ফরম্যাটে লিংক বা টেক্সট পেস্ট করুন!</b><br>
            একই সাথে সাধারণ লিংক, শর্ট লিংক (`vt.tiktok.com`), এলোমেলো টেক্সট বা এইচটিএমএল দিলে সিস্টেম নিজে থেকে টিকটক লিংক খুঁজে নেবে।
        </div>

        <textarea id="rawInput" placeholder="এখানে টিকটক লিংক অথবা যেকোনো টেক্সট/লিংক পেস্ট করুন...
উদাহরণ: https://vt.tiktok.com/ZSgUUw1xk/"></textarea>

        <div class="controls-grid">
            <div class="control-item">
                <label>⚡ প্রসেসিং স্পিড:</label>
                <select id="speedMode">
                    <option value="1">🐢 Safe (1x parallel)</option>
                    <option value="3" selected>🚗 Normal (3x parallel)</option>
                    <option value="5">🏎️ Fast (5x parallel)</option>
                    <option value="8">⚡ Turbo (8x parallel)</option>
                </select>
            </div>
            <div class="control-item">
                <label>🎯 Related Video Limit (প্রতি লিংকে):</label>
                <select id="relatedLimit">
                    <option value="0">শুধু মূল লিংক প্রসেস করুন (0)</option>
                    <option value="20">২০ টি সম্পর্কিত ভিডিও</option>
                    <option value="50" selected>৫০ টি সম্পর্কিত ভিডিও</option>
                    <option value="100">১০-১০০ টি সম্পর্কিত ভিডিও</option>
                    <option value="500">৫০০ টি সম্পর্কিত ভিডিও (Deep Search)</option>
                </select>
            </div>
        </div>

        <button id="startBtn" class="btn-main" onclick="processExtraction()">
            🚀 এক্সট্র্যাক্ট এবং অটো-ডিসকভার শুরু করুন
        </button>

        <!-- Live Progress & Dashboard -->
        <div id="progressSection" class="progress-section">
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="stats-grid">
                <div>মোট<div id="statTotal" class="stat-val stat-total">0</div></div>
                <div>সফল<div id="statSuccess" class="stat-val stat-success">0</div></div>
                <div>স্কিপ<div id="statSkip" class="stat-val stat-skip">0</div></div>
                <div>এরর<div id="statError" class="stat-val stat-error">0</div></div>
                <div>⚡ রেট<div id="statRate" class="stat-val stat-rate">0/s</div></div>
            </div>
        </div>
    </div>

    <!-- Output Card -->
    <div class="card">
        <h2>
            📤 রেজাল্ট / আউটপুট
            <span style="font-size: 13px; color: var(--text-sub);">মোট: <b id="outputCount" style="color:var(--success);">0</b> টি</span>
        </h2>
        <textarea id="outputArea" class="output-textarea" readonly placeholder="ফলাফল এখানে লাইন বাই লাইন দেখা যাবে..."></textarea>
        
        <div class="btn-group">
            <button class="btn-secondary" onclick="copyOutput()">📋 কপি করুন</button>
            <button class="btn-secondary" onclick="downloadTxt()">📄 Download TXT</button>
            <button class="btn-secondary btn-clear" onclick="clearAll()">🗑️ ক্লিয়ার</button>
        </div>
    </div>
</div>

<script>
let isProcessing = false;
let extractedResultSet = new Set();

// ১. Auto-Discover Regex Logic (যেকোনো মেসড টেক্সট থেকে টিকটক লিংক ডিটেক্ট করবে)
function extractTikTokUrls(text) {
    const pattern = /(https?:\/\/(?:www\.|vt\.|vm\.|t\.)?tiktok\.com\/[^\s"'>]+)/gi;
    const matches = text.match(pattern) || [];
    // Clean up duplicate trailing symbols if any
    return Array.from(new Set(matches.map(url => url.replace(/[;,.>)]+$/, ''))));
}

async function processExtraction() {
    if (isProcessing) return;

    const rawText = document.getElementById('rawInput').value;
    const foundUrls = extractTikTokUrls(rawText);

    if (foundUrls.length === 0) {
        alert("কোনো সঠিক টিকটক লিংক পাওয়া যায়নি! দয়া করে সঠিক লিংক দিন।");
        return;
    }

    const concurrency = parseInt(document.getElementById('speedMode').value);
    const limit = parseInt(document.getElementById('relatedLimit').value);

    // Reset UI
    isProcessing = true;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('progressSection').style.display = 'block';
    
    let total = foundUrls.length;
    let success = 0, skip = 0, error = 0;
    let startTime = Date.now();

    updateStats(total, success, skip, error, "0/s", 0);

    // Queue for Parallel Processing (Safe, Normal, Turbo)
    let queue = [...foundUrls];
    
    async function worker() {
        while (queue.length > 0) {
            const url = queue.shift();
            try {
                const response = await fetch(`/api/scrape?url=${encodeURIComponent(url)}&limit=${limit}`);
                const data = await response.json();

                if (data.success && data.links && data.links.length > 0) {
                    data.links.forEach(link => {
                        if (!extractedResultSet.has(link)) {
                            extractedResultSet.add(link);
                            success++;
                        } else {
                            skip++;
                        }
                    });
                } else {
                    error++;
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                error++;
            }

            // Update Metrics Real-Time
            let processed = success + skip + error;
            let elapsedSec = (Date.now() - startTime) / 1000;
            let rate = elapsedSec > 0 ? (processed / elapsedSec).toFixed(1) : 0;
            let percent = Math.min(100, Math.round((processed / total) * 100));

            updateStats(total, success, skip, error, `${rate}/s`, percent);
            updateOutputText();
        }
    }

    // Worker Threads Run based on Turbo/Parallel Selection
    const workers = [];
    for (let i = 0; i < Math.min(concurrency, queue.length); i++) {
        workers.push(worker());
    }

    await Promise.all(workers);

    isProcessing = false;
    document.getElementById('startBtn').disabled = false;
    alert("এক্সট্র্যাক্ট সফলভাবে সম্পূর্ণ হয়েছে!");
}

function updateStats(total, success, skip, error, rateStr, percent) {
    document.getElementById('statTotal').innerText = total;
    document.getElementById('statSuccess').innerText = success;
    document.getElementById('statSkip').innerText = skip;
    document.getElementById('statError').innerText = error;
    document.getElementById('statRate').innerText = rateStr;
    document.getElementById('progressBar').style.width = percent + '%';
}

function updateOutputText() {
    const list = Array.from(extractedResultSet);
    document.getElementById('outputArea').value = list.join('\n');
    document.getElementById('outputCount').innerText = list.length;
}

function copyOutput() {
    const area = document.getElementById('outputArea');
    if (!area.value) return alert("কপি করার মতো কোনো ডেটা নেই!");
    area.select();
    document.execCommand("copy");
    alert("সবগুলো লিংক কপি করা হয়েছে!");
}

function downloadTxt() {
    const area = document.getElementById('outputArea');
    if (!area.value) return alert("ডাউনলোড করার মতো কোনো ডেটা নেই!");
    const blob = new Blob([area.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tiktok_links_${Date.now()}.txt`;
    a.click();
}

function clearAll() {
    if (confirm("আপনি কি সব ক্লিয়ার করতে চান?")) {
        extractedResultSet.clear();
        document.getElementById('rawInput').value = '';
        document.getElementById('outputArea').value = '';
        document.getElementById('outputCount').innerText = '0';
        document.getElementById('progressSection').style.display = 'none';
    }
}
</script>

</body>
</html>
