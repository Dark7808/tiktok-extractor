<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 TikTok Ultimate Extractor & Scraper</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #fe2c55;
            --accent-hover: #e02447;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 15px; }
        
        .header { text-align: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .header h1 { font-size: 22px; color: var(--text-main); }
        .header h1 span { color: var(--accent-color); font-weight: 800; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 18px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }

        textarea { width: 100%; height: 130px; background: #0b1120; color: #38bdf8; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); font-family: monospace; font-size: 13px; resize: vertical; margin-bottom: 12px; outline: none; }
        textarea:focus { border-color: var(--accent-color); }

        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .control-item { display: flex; flex-direction: column; gap: 5px; }
        .control-item label { font-size: 12px; color: var(--text-sub); font-weight: 600; }
        select { padding: 9px; border-radius: 6px; border: 1px solid var(--border-color); background: #0b1120; color: #fff; font-size: 13px; outline: none; }

        .btn-main { background: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s ease; width: 100%; }
        .btn-main:hover { background: var(--accent-hover); }
        .btn-main:disabled { background: #475569; cursor: not-allowed; }

        .progress-section { margin-top: 12px; display: none; }
        .progress-bar-container { width: 100%; height: 6px; background: #0b1120; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar { height: 100%; width: 0%; background: var(--accent-color); transition: width 0.3s; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #0b1120; padding: 10px; border-radius: 8px; text-align: center; font-size: 11px; }
        .stat-val { font-size: 14px; font-weight: bold; margin-top: 2px; }

        .output-textarea { height: 260px; color: var(--success); }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn-sec { flex: 1; min-width: 100px; background: #2563eb; color: #fff; border: none; padding: 9px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }
        .btn-sec:hover { background: #1d4ed8; }
        .btn-clear { background: #475569; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📦 TikTok Ultimate Extractor <span>TURBO</span></h1>
    </div>

    <!-- Input Card -->
    <div class="card">
        <h2>📥 ইনপুট (Auto-Discover TikTok Links)</h2>
        <textarea id="rawInput" placeholder="এখানে টিকটক ভিডিও লিংক পেস্ট করুন...
উদাহরণ: https://vt.tiktok.com/ZSgP1t5sM/"></textarea>

        <div class="controls-grid">
            <div class="control-item">
                <label>⚡ আউটপুট ফরম্যাট:</label>
                <select id="outputFormat">
                    <option value="meta">ক্যাপশন | Video ID | Thumbnail URL</option>
                    <option value="links" selected>শুধু ভিডিও শেয়ার লিংক (Share URLs)</option>
                </select>
            </div>
            <div class="control-item">
                <label>🎯 Related Video Limit:</label>
                <select id="relatedLimit">
                    <option value="0">শুধু মূল লিংক (0)</option>
                    <option value="20" selected>২০ টি সম্পর্কিত ভিডিও</option>
                    <option value="50">৫০ টি সম্পর্কিত ভিডিও</option>
                    <option value="100">১০০ টি সম্পর্কিত ভিডিও</option>
                </select>
            </div>
        </div>

        <button id="startBtn" class="btn-main" onclick="startExtraction()">🚀 এক্সট্র্যাক্ট শুরু করুন</button>

        <div id="progressSection" class="progress-section">
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="stats-grid">
                <div>মোট<div id="statTotal" class="stat-val" style="color:#38bdf8;">0</div></div>
                <div>সফল<div id="statSuccess" class="stat-val" style="color:var(--success);">0</div></div>
                <div>স্কিপ<div id="statSkip" class="stat-val" style="color:#f59e0b;">0</div></div>
                <div>এরর<div id="statError" class="stat-val" style="color:var(--error);">0</div></div>
                <div>⚡ রেট<div id="statRate" class="stat-val" style="color:#a855f7;">0/s</div></div>
            </div>
        </div>
    </div>

    <!-- Output Card -->
    <div class="card">
        <h2>📤 আউটপুট <span style="font-size:12px; color:var(--text-sub);">মোট: <b id="outputCount" style="color:var(--success);">0</b></span></h2>
        <textarea id="outputArea" class="output-textarea" readonly placeholder="ফলাফল এখানে চলে আসবে..."></textarea>
        
        <div class="btn-group">
            <button class="btn-sec" onclick="copyOutput()">📋 কপি করুন</button>
            <button class="btn-sec" onclick="downloadTxt()">📄 Download TXT</button>
            <button class="btn-sec btn-clear" onclick="clearAll()">🗑️ ক্লিয়ার</button>
        </div>
    </div>
</div>

<script>
let isProcessing = false;
let extractedResults = new Set();

function extractUrls(text) {
    const pattern = /(https?:\/\/(?:www\.|vt\.|vm\.|t\.)?tiktok\.com\/[^\s"'>]+)/gi;
    const matches = text.match(pattern) || [];
    return Array.from(new Set(matches.map(u => u.replace(/[;,.>)]+$/, ''))));
}

async function startExtraction() {
    if (isProcessing) return;

    const rawText = document.getElementById('rawInput').value;
    const urls = extractUrls(rawText);

    if (urls.length === 0) {
        alert("কোনো সঠিক টিকটক লিংক পাওয়া যায়নি!");
        return;
    }

    const limit = parseInt(document.getElementById('relatedLimit').value);
    const formatMode = document.getElementById('outputFormat').value;

    isProcessing = true;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('progressSection').style.display = 'block';

    let total = urls.length;
    let success = 0, skip = 0, error = 0;
    let startTime = Date.now();

    for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        try {
            const apiEndpoint = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
            const res = await fetch(apiEndpoint);
            const json = await res.json();

            if (json && json.data) {
                const data = json.data;
                
                let resultLine = "";
                if (formatMode === "meta") {
                    const caption = (data.title || "TikTok Video").replace(/\n/g, ' ');
                    const videoId = data.id || "0000000";
                    const cover = data.cover || data.origin_cover || "";
                    resultLine = `${caption} | ${videoId} | ${cover}`;
                } else {
                    const username = data.author?.unique_id || 'user';
                    resultLine = `https://www.tiktok.com/@${username}/video/${data.id}`;
                }

                if (!extractedResults.has(resultLine)) {
                    extractedResults.add(resultLine);
                    success++;
                } else {
                    skip++;
                }

                if (limit > 0 && data.title) {
                    const tagMatch = data.title.match(/#\w+/g);
                    const keyword = tagMatch ? tagMatch[0].replace('#', '') : "trending";
                    
                    const feedUrl = `https://www.tikwm.com/api/feed/search?keywords=${encodeURIComponent(keyword)}&count=${limit}`;
                    const feedRes = await fetch(feedUrl);
                    const feedJson = await feedRes.json();

                    if (feedJson && feedJson.data && feedJson.data.videos) {
                        for (const vid of feedJson.data.videos) {
                            let relLine = "";
                            if (formatMode === "meta") {
                                const relCap = (vid.title || "Related Video").replace(/\n/g, ' ');
                                relLine = `${relCap} | ${vid.video_id} | ${vid.cover}`;
                            } else {
                                relLine = `https://www.tiktok.com/@${vid.author.unique_id}/video/${vid.video_id}`;
                            }

                            if (!extractedResults.has(relLine)) {
                                extractedResults.add(relLine);
                                success++;
                            } else {
                                skip++;
                            }
                        }
                    }
                }

            } else {
                error++;
            }
        } catch (e) {
            console.error(e);
            error++;
        }

        let processed = success + skip + error;
        let elapsed = (Date.now() - startTime) / 1000;
        let rate = elapsed > 0 ? (processed / elapsed).toFixed(1) : 0;
        let percent = Math.min(100, Math.round(((i + 1) / total) * 100));

        updateDashboard(total, success, skip, error, `${rate}/s`, percent);
        renderOutput();
    }

    isProcessing = false;
    document.getElementById('startBtn').disabled = false;
    alert("এক্সট্র্যাক্ট সফলভাবে সম্পূর্ণ হয়েছে!");
}

function updateDashboard(total, success, skip, error, rate, percent) {
    document.getElementById('statTotal').innerText = total;
    document.getElementById('statSuccess').innerText = success;
    document.getElementById('statSkip').innerText = skip;
    document.getElementById('statError').innerText = error;
    document.getElementById('statRate').innerText = rate;
    document.getElementById('progressBar').style.width = percent + '%';
}

function renderOutput() {
    const arr = Array.from(extractedResults);
    document.getElementById('outputArea').value = arr.join('\n');
    document.getElementById('outputCount').innerText = arr.length;
}

function copyOutput() {
    const area = document.getElementById('outputArea');
    if (!area.value) return alert("কপি করার কিছু নেই!");
    area.select();
    document.execCommand("copy");
    alert("কপি করা হয়েছে!");
}

function downloadTxt() {
    const area = document.getElementById('outputArea');
    if (!area.value) return alert("ডাউনলোড করার মতো কিছু নেই!");
    const blob = new Blob([area.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tiktok_extracted_${Date.now()}.txt`;
    a.click();
}

function clearAll() {
    extractedResults.clear();
    document.getElementById('rawInput').value = '';
    document.getElementById('outputArea').value = '';
    document.getElementById('outputCount').innerText = '0';
    document.getElementById('progressSection').style.display = 'none';
}
</script>

</body>
</html>
