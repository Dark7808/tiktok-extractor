<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Ultimate Scraper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0a0a0a;min-height:100vh;color:#fff;padding:14px}
.hd{max-width:900px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.hd h1{color:#ff3366;font-size:1.2rem}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:#141414;padding:6px;border-radius:12px;border:1px solid #222;overflow-x:auto}
.tab{flex:1;text-align:center;padding:10px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;color:#888;white-space:nowrap}
.tab.active{background:#ff3366;color:#fff}
.box{background:#141414;border:1px solid #222;border-radius:14px;padding:18px;max-width:900px;margin:0 auto 14px;display:none}
.box.active{display:block}
.box h2{color:#ff3366;font-size:1rem;margin-bottom:12px}
label{display:block;font-size:.75rem;color:#ffc107;margin-bottom:5px;font-weight:600}
input,textarea,select{width:100%;padding:11px;border-radius:8px;background:#000;color:#fff;border:1px solid #333;font-size:.85rem;font-family:monospace}
textarea{min-height:100px;resize:vertical}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{border:none;border-radius:8px;padding:12px 16px;font-size:.88rem;font-weight:600;cursor:pointer}
.b-main{background:#ff3366;color:#fff;flex:1;min-width:140px}
.b-alt{background:#222;color:#00f2ea;border:1px solid #333}
.b-green{background:#4caf50;color:#fff}
.status{display:none;margin-top:14px;padding:12px;background:#000;border-radius:8px;color:#00f2ea;text-align:center}
.status.show{display:block}
pre{background:#000;border:1px solid #222;border-radius:10px;padding:14px;font-family:monospace;font-size:.78rem;line-height:1.8;white-space:pre-wrap;word-break:break-all;color:#ddd;max-height:400px;overflow-y:auto;margin-top:12px}
.feed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.feed-card{background:#000;border:1px solid #333;border-radius:10px;overflow:hidden}
.feed-card img{width:100%;height:150px;object-fit:cover}
.feed-card .content{padding:12px}
.feed-card h4{color:#00f2ea;font-size:.85rem;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-card a{display:inline-block;background:#ff3366;color:#fff;padding:6px 12px;border-radius:6px;font-size:.75rem;text-decoration:none;margin-top:5px}
</style>
</head>
<body>

<div class="hd"><h1>📦 TikTok Ultimate Scraper</h1></div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('links', this)">📥 Bulk Links</div>
  <div class="tab" onclick="switchTab('user', this)">👤 User Videos</div>
  <div class="tab" onclick="switchTab('hashtag', this)">🏷️ Hashtag Search</div>
</div>

<!-- TAB 1: BULK LINKS -->
<div class="box active" id="tab-links">
  <h2>Bulk Extract from Links</h2>
  <label>📥 TikTok লিংক পেস্ট করুন (প্রতি লাইনে একটি)</label>
  <textarea id="inpLinks" placeholder="https://vt.tiktok.com/ZSgjofPnM/
https://vt.tiktok.com/ZSg6ywF3e/"></textarea>
  
  <div style="margin-top:12px; display:flex; gap:10px; align-items:center">
    <input type="checkbox" id="autoNotification" checked style="width:20px;height:20px">
    <label for="autoNotification" style="margin:0;color:#4caf50">🔔 প্রসেস শেষে নোটিফিকেশন দিন</label>
  </div>

  <div class="btn-row">
    <button class="b-main" onclick="runLinks()" id="btnLinks">🚀 Extract Links</button>
    <button class="b-alt" onclick="clearAll('resLinks')">🗑️ Clear</button>
  </div>

  <div class="status" id="stLinks">প্রসেস হচ্ছে...</div>
  <pre id="resLinks" style="display:none"></pre>
  
  <div class="btn-row" id="actionLinks" style="display:none">
    <button class="b-alt" onclick="copyData('resLinks')">📋 Copy</button>
    <button class="b-alt" onclick="downloadTXT('resLinks')">⬇️ .txt</button>
    <button class="b-alt" onclick="downloadCSV('resLinks')">📊 .csv</button>
  </div>
</div>

<!-- TAB 2: USER VIDEOS -->
<div class="box" id="tab-user">
  <h2>Fetch Videos by Username</h2>
  <label>👤 ইউজারনেম দিন (@ ছাড়া)</label>
  <input id="inpUser" type="text" placeholder="যেমন: aliza_h0n3">
  <div class="btn-row">
    <button class="b-main" onclick="runUser()" id="btnUser">🔍 Get All Videos</button>
  </div>
  <div class="status" id="stUser">লোড হচ্ছে...</div>
  <div class="feed-grid" id="userGrid"></div>
</div>

<!-- TAB 3: HASHTAG -->
<div class="box" id="tab-hashtag">
  <h2>Search by Hashtag</h2>
  <label>🏷️ হ্যাশট্যাগ দিন (# ছাড়া)</label>
  <input id="inpHashtag" type="text" placeholder="যেমন: hotdance">
  <div class="btn-row">
    <button class="b-main" onclick="runHashtag()" id="btnHashtag">🔍 Search Hashtag</button>
  </div>
  <div class="status" id="stHashtag">খোঁজা হচ্ছে...</div>
  <div class="feed-grid" id="hashtagGrid"></div>
</div>

<script>
function switchTab(id, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.box').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
}

async function api(payload) {
  const res = await fetch('/api/extract', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
  });
  return res.json();
}

// ১. Bulk Links (Parallel Processing for Speed)
async function runLinks() {
  const raw = document.getElementById('inpLinks').value.trim();
  if(!raw) return alert('লিংক দিন');
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l);
  const st = document.getElementById('stLinks'), res = document.getElementById('resLinks');
  const btn = document.getElementById('btnLinks');
  
  st.style.display = 'block'; st.textContent = `প্রসেস হচ্ছে 0/${lines.length}...`;
  res.style.display = 'none'; document.getElementById('actionLinks').style.display = 'none';
  btn.disabled = true;

  // Parallel Fetching for Speed (Max 5 at a time)
  let results = [];
  let completed = 0;
  const chunkSize = 5; 
  
  for (let i = 0; i < lines.length; i += chunkSize) {
    const chunk = lines.slice(i, i + chunkSize);
    const promises = chunk.map(async (link) => {
      try {
        const d = await api({ url: link, action: 'extract' });
        completed++;
        st.textContent = `প্রসেস হচ্ছে ${completed}/${lines.length}...`;
        if (d.success && d.data) {
          return `${d.data.title} | ${d.data.videoId} | ${d.data.thumbnailUrl}`;
        } else {
          return `ERROR | ${link} | Failed`;
        }
      } catch (e) {
        completed++;
        return `ERROR | ${link} | Network Error`;
      }
    });
    
    const chunkResults = await Promise.all(promises);
    results.push(...chunkResults);
  }

  st.style.display = 'none'; btn.disabled = false;
  res.style.display = 'block'; res.textContent = results.join('\n');
  document.getElementById('actionLinks').style.display = 'flex';
  
  if(document.getElementById('autoNotification').checked) {
    sendNotification('Extraction Complete!', `${lines.length} টি লিংক প্রসেস করা হয়েছে।`);
  }
}

// ২. Fetch User Videos
async function runUser() {
  const user = document.getElementById('inpUser').value.trim().replace('@','');
  if(!user) return alert('ইউজারনেম দিন');
  const st = document.getElementById('stUser'), grid = document.getElementById('userGrid');
  const btn = document.getElementById('btnUser');
  
  st.style.display = 'block'; st.textContent = 'লোড হচ্ছে...'; grid.innerHTML = ''; btn.disabled = true;

  try {
    const d = await api({ action: 'user', username: user });
    st.style.display = 'none'; btn.disabled = false;
    if (d.success && d.videos.length > 0) {
      d.videos.forEach(v => {
        grid.innerHTML += `
          <div class="feed-card">
            <img src="${v.thumbnail}" alt="thumb">
            <div class="content">
              <h4>${v.title}</h4>
              <a href="${v.link}" target="_blank">🔗 Watch Video</a>
            </div>
          </div>`;
      });
      sendNotification('User Videos Loaded!', `@${user} এর ${d.videos.length} টি ভিডিও পাওয়া গেছে।`);
    } else {
      grid.innerHTML = '<p style="color:#aaa">কোনো ভিডিও পাওয়া যায়নি।</p>';
    }
  } catch(e) { st.style.display='none'; btn.disabled = false; alert('Error'); }
}

// ৩. Fetch Hashtag Videos
async function runHashtag() {
  const tag = document.getElementById('inpHashtag').value.trim().replace('#','');
  if(!tag) return alert('হ্যাশট্যাগ দিন');
  const st = document.getElementById('stHashtag'), grid = document.getElementById('hashtagGrid');
  const btn = document.getElementById('btnHashtag');
  
  st.style.display = 'block'; st.textContent = 'খোঁজা হচ্ছে...'; grid.innerHTML = ''; btn.disabled = true;

  try {
    const d = await api({ action: 'hashtag', tag: tag });
    st.style.display = 'none'; btn.disabled = false;
    if (d.success && d.videos.length > 0) {
      d.videos.forEach(v => {
        grid.innerHTML += `
          <div class="feed-card">
            <img src="${v.thumbnail}" alt="thumb">
            <div class="content">
              <h4>${v.title}</h4>
              <a href="${v.link}" target="_blank">🔗 Watch Video</a>
            </div>
          </div>`;
      });
      sendNotification('Hashtag Videos Loaded!', `#${tag} এর ${d.videos.length} টি ভিডিও পাওয়া গেছে।`);
    } else {
      grid.innerHTML = '<p style="color:#aaa">এই হ্যাশট্যাগে কোনো ভিডিও পাওয়া যায়নি।</p>';
    }
  } catch(e) { st.style.display='none'; btn.disabled = false; alert('Error'); }
}

// Notification Function
function sendNotification(title, body) {
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    new Notification(title, { body: body });
  } else if (Notification.permission !== "denied") {
    Notification.requestPermission().then(permission => {
      if (permission === "granted") new Notification(title, { body: body });
    });
  }
}

// Helpers (Clear, Copy, TXT, CSV)
function clearAll(id) {
  document.getElementById(id).value = '';
  document.getElementById(id).style.display = 'none';
  document.getElementById('actionLinks').style.display = 'none';
}
function copyData(id) {
  const txt = document.getElementById(id).textContent;
  navigator.clipboard.writeText(txt).then(() => alert('Copied!'));
}
function downloadTXT(id) {
  const txt = document.getElementById(id).textContent;
  const blob = new Blob([txt], {type: 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tiktok.txt'; a.click();
}
function downloadCSV(id) {
  const txt = document.getElementById(id).textContent;
  const csv = txt.split('\n').map(line => {
    return line.split('|').map(p => p.trim()).join(',');
  }).join('\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tiktok.csv'; a.click();
}
</script>
</body>
</html>
