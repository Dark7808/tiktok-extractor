<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulk Import</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0a0a0a;min-height:100vh;color:#fff;padding:14px}
.hd{max-width:900px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.hd h1{color:#ff3366;font-size:1.3rem}
.box{background:#141414;border:1px solid #222;border-radius:14px;padding:18px;max-width:900px;margin:0 auto 14px}
.box h2{color:#ff3366;font-size:1rem;margin-bottom:12px}
label{display:block;font-size:.75rem;color:#ffc107;margin-bottom:5px;font-weight:600}
input,textarea{width:100%;padding:11px;border-radius:8px;background:#000;color:#fff;border:1px solid #333;font-size:.85rem;font-family:monospace}
textarea{min-height:180px;resize:vertical;line-height:1.7}
input:focus,textarea:focus{outline:none;border-color:#ff3366}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{border:none;border-radius:8px;padding:12px 16px;font-size:.88rem;font-weight:600;cursor:pointer}
.b-main{background:#ff3366;color:#fff;flex:1;min-width:140px}
.b-main:disabled{opacity:.5;cursor:not-allowed}
.b-alt{background:#222;color:#00f2ea;border:1px solid #333}
.status{display:none;margin-top:14px;padding:12px;background:#000;border-radius:8px;color:#00f2ea;font-size:.85rem;text-align:center}
.status.show{display:block}
.bar{height:6px;background:#222;border-radius:3px;margin-top:8px;overflow:hidden}
.fill{height:100%;background:#ff3366;width:0%;transition:width .3s}
.out{display:none}
.out.show{display:block}
pre{background:#000;border:1px solid #222;border-radius:10px;padding:14px;font-family:monospace;font-size:.78rem;line-height:1.8;white-space:pre-wrap;word-break:break-all;color:#ddd;max-height:500px;overflow-y:auto}
.fmt{background:#000;border-radius:8px;padding:12px;font-family:monospace;font-size:.78rem;color:#aaa;line-height:1.7;margin-bottom:12px}
.fmt b{color:#00f2ea}
.hint{font-size:.72rem;color:#666;margin-top:5px}
</style>
</head>
<body>

<div class="hd">
  <h1>📦 Bulk Import</h1>
</div>

<div class="box">
  <h2>Format</h2>
  <div class="fmt">
    প্রতি লাইনে একটি TikTok লিংক পেস্ট করুন।<br>
    <b>Title | TikTok URL/ID | Category | Thumbnail URL</b>
  </div>

  <label>📥 TikTok লিংকগুলো (প্রতি লাইনে একটি)</label>
  <textarea id="inp" placeholder="https://vt.tiktok.com/ZSbkNHyWs/
https://vt.tiktok.com/ZSbkNUXgA/"></textarea>
  <div class="hint">💡 Short link (vt.tiktok.com) সাপোর্ট করে।</div>

  <label style="margin-top:12px">Default Category (ঐচ্ছিক)</label>
  <input id="cat" type="text" placeholder="যেমন: Trending">

  <div class="btn-row">
    <button class="b-main" id="go" onclick="run()">🚀 Import</button>
    <button class="b-alt" onclick="clearAll()">🗑️ Clear</button>
  </div>

  <div class="status" id="st">
    <span id="stx">প্রসেস হচ্ছে...</span>
    <div class="bar"><div class="fill" id="fl"></div></div>
  </div>
</div>

<div class="box out" id="out">
  <h2>📤 আউটপুট</h2>
  <pre id="res"></pre>
  <div class="btn-row">
    <button class="b-alt" onclick="copyAll()">📋 Copy All</button>
    <button class="b-alt" onclick="downloadAll()">⬇️ Download</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  var $inp = document.getElementById('inp');
  var $cat = document.getElementById('cat');
  var $go  = document.getElementById('go');
  var $st  = document.getElementById('st');
  var $stx = document.getElementById('stx');
  var $fl  = document.getElementById('fl');
  var $out = document.getElementById('out');
  var $res = document.getElementById('res');

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function extractId(url){
    var m = url.match(/\/video\/(\d+)/);
    return m ? m[1] : '';
  }

  // Netlify Function-এ কল (server-side tikwm.com কল করে)
  async function callServer(url) {
    var res = await fetch('/api/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: url })
    });

    var j;
    try { j = await res.json(); }
    catch(e) { throw new Error('Invalid response'); }

    if (!res.ok || !j.success) {
      throw new Error(j.error || ('এরর ' + res.status));
    }

    return j.data;
  }

  async function processOne(url) {
    try {
      var d = await callServer(url);
      return {
        ok: true,
        title: d.title || 'Untitled',
        id: d.videoId || extractId(url),
        thumb: d.thumbnailUrl || ''
      };
    } catch(e) {
      return { ok: false, error: e.message || 'ব্যর্থ' };
    }
  }

  window.run = async function(){
    var raw = ($inp.value || '').trim();
    if (!raw) { alert('⚠️ অনুগ্রহ করে কিছু TikTok লিংক দিন'); return; }

    var cat = ($cat.value || '').trim() || 'Trending';
    var lines = raw.replace(/\r/g, '').split('\n')
      .map(function(l){ return l.trim(); })
      .filter(function(l){ return l.length > 0; });

    if (!lines.length) { alert('⚠️ কোনো বৈধ লিংক নেই'); return; }

    var out = [];
    $go.disabled = true;
    $st.classList.add('show');
    $out.classList.remove('show');
    $res.textContent = '';
    $fl.style.width = '0%';

    for (var i = 0; i < lines.length; i++) {
      var url = lines[i];
      $fl.style.width = Math.round(((i+1) / lines.length) * 100) + '%';
      $stx.textContent = 'প্রসেস হচ্ছে ' + (i+1) + '/' + lines.length + '...';

      var r = await processOne(url);

      if (r.ok) {
        out.push(r.title + ' | ' + r.id + ' | ' + cat + ' | ' + r.thumb);
      } else {
        out.push('ERROR | ' + url + ' | ' + cat + ' | ' + r.error);
      }

      // রেট লিমিট এড়াতে ছোট বিরতি
      if (i < lines.length - 1) {
        await sleep(500);
      }
    }

    $res.textContent = out.join('\n');
    $st.classList.remove('show');
    $go.disabled = false;
    $out.classList.add('show');
    $fl.style.width = '100%';
    try { $out.scrollIntoView({ behavior:'smooth', block:'start' }); } catch(e){}
  };

  window.clearAll = function(){
    $inp.value = '';
    $out.classList.remove('show');
    $res.textContent = '';
    $fl.style.width = '0%';
  };

  window.copyAll = function(){
    var t = $res.textContent || '';
    if (!t) { alert('কিছু নেই'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function(){ alert('✅ Copy হয়েছে'); }).catch(function(){ fbCopy(t); });
    } else fbCopy(t);
  };

  function fbCopy(text){
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      alert('✅ Copy হয়েছে');
    } catch(e){ alert('❌ Copy ব্যর্থ'); }
  }

  window.downloadAll = function(){
    var t = $res.textContent || '';
    if (!t) { alert('কিছু নেই'); return; }
    try {
      var b = new Blob([t], { type:'text/plain;charset=utf-8' });
      var u = URL.createObjectURL(b);
      var a = document.createElement('a');
      a.href = u; a.download = 'bulk-output-' + Date.now() + '.txt';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
    } catch(e){ alert('❌ Download ব্যর্থ'); }
  };

})();
</script>
</body>
</html>
