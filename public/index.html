<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulk Import & Discover</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0a0a0a;min-height:100vh;color:#fff;padding:14px}
.hd{max-width:900px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;padding:10px 0;flex-wrap:wrap;gap:8px}
.hd h1{color:#ff3366;font-size:1.3rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{background:#4caf50;color:#fff;font-size:.65rem;padding:3px 7px;border-radius:10px}
.badge-purple{background:#9c27b0}
.badge-turbo{background:#ff9800}
.box{background:#141414;border:1px solid #222;border-radius:14px;padding:18px;max-width:900px;margin:0 auto 14px}
.box h2{color:#ff3366;font-size:1rem;margin-bottom:12px}
label{display:block;font-size:.75rem;color:#ffc107;margin-bottom:5px;font-weight:600}
input,textarea{width:100%;padding:11px;border-radius:8px;background:#000;color:#fff;border:1px solid #333;font-size:.85rem;font-family:monospace}
textarea{min-height:180px;resize:vertical;line-height:1.7}
input:focus,textarea:focus{outline:none;border-color:#ff3366}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{border:none;border-radius:8px;padding:12px 16px;font-size:.88rem;font-weight:600;cursor:pointer}
.b-main{background:#ff3366;color:#fff;flex:1;min-width:140px}
.b-main:disabled{opacity:.5;cursor:not-allowed}
.b-alt{background:#222;color:#00f2ea;border:1px solid #333}
.b-green{background:#4caf50;color:#fff}
.status{display:none;margin-top:14px;padding:12px;background:#000;border-radius:8px;color:#00f2ea;font-size:.85rem;text-align:center}
.status.show{display:block}
.bar{height:6px;background:#222;border-radius:3px;margin-top:8px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#ff3366,#ff9800);width:0%;transition:width .3s}
.out{display:none; margin-top:14px}
.out.show{display:block}
pre{background:#000;border:1px solid #222;border-radius:10px;padding:14px;font-family:monospace;font-size:.78rem;line-height:1.8;white-space:pre-wrap;word-break:break-all;color:#ddd;max-height:500px;overflow-y:auto}
.fmt{background:#000;border-radius:8px;padding:12px;font-family:monospace;font-size:.78rem;color:#aaa;line-height:1.7;margin-bottom:12px}
.fmt b{color:#00f2ea}
.hint{font-size:.72rem;color:#666;margin-top:5px;line-height:1.7}
.auto-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px;background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.25);border-radius:8px}
.auto-row input[type=checkbox]{width:20px;height:20px;flex-shrink:0;cursor:pointer;accent-color:#4caf50;margin:0}
.auto-row label{margin:0;color:#4caf50;font-size:.82rem;cursor:pointer;font-weight:500;line-height:1.4;text-transform:none}
.disc-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px;background:rgba(156,39,176,.08);border:1px solid rgba(156,39,176,.3);border-radius:8px}
.disc-row input[type=checkbox]{width:20px;height:20px;flex-shrink:0;cursor:pointer;accent-color:#9c27b0;margin:0}
.disc-row label{margin:0;color:#e91e63;font-size:.85rem;cursor:pointer;font-weight:600;line-height:1.4;text-transform:none}
.speed-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px;background:rgba(255,152,0,.08);border:1px solid rgba(255,152,0,.25);border-radius:8px;flex-wrap:wrap}
.speed-row label{margin:0;color:#ff9800;font-size:.82rem;font-weight:500;text-transform:none;flex:1;min-width:180px}
.speed-row select{background:#000;color:#ff9800;border:1px solid rgba(255,152,0,.4);border-radius:6px;padding:6px 10px;font-size:.82rem;font-family:monospace;cursor:pointer}
.stat-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;font-size:.75rem;color:#888}
.stat-row span{background:#000;padding:5px 10px;border-radius:6px;border:1px solid #222}
.stat-row b{color:#00f2ea}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a1a1a;border:2px solid #4caf50;color:#fff;padding:14px 22px;border-radius:12px;font-size:.88rem;font-weight:600;z-index:9999;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 10px 40px rgba(76,175,80,.3)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.error{border-color:#ff0050;box-shadow:0 10px 40px rgba(255,0,80,.3)}
</style>
</head>
<body>

<div class="hd">
  <h1>📦 Bulk Import <span class="badge">AUTO</span> <span class="badge badge-purple">DISCOVER</span> <span class="badge badge-turbo">⚡ TURBO</span></h1>
</div>

<div class="box">
  <h2>Format</h2>
  <div class="fmt">
    <b>যেকোনো ফরম্যাটে লিংক পেস্ট করুন!</b><br>
    প্রতি লাইনে একটি, একই লাইনে অনেকগুলো, টেক্সটের ভেতরে, HTML paste — সিস্টেম নিজেই খুঁজে বের করবে।
  </div>

  <label>📥 TikTok লিংক (যেকোনো ফরম্যাট)</label>
  <textarea id="inp" placeholder="https://vt.tiktok.com/ZSgjAnRoJ/"></textarea>

  <!-- ⭐ ডিসকভারি মোড ⭐ -->
  <div class="disc-row">
    <input type="checkbox" id="autoDiscover">
    <label for="autoDiscover">🔍 Discover Mode — ১টি লিংক থেকে ১০০+ রিলেটেড ভিডিও (Creator + Tag + Music)</label>
  </div>

  <div class="speed-row">
    <label for="speedMode">⚡ Speed Mode (Bulk Extract এর জন্য)</label>
    <select id="speedMode">
      <option value="safe">🐢 Safe (1x parallel)</option>
      <option value="normal" selected>🚗 Normal (3x parallel)</option>
      <option value="fast">🏎️ Fast (5x parallel)</option>
      <option value="turbo">⚡ Turbo (8x parallel)</option>
    </select>
  </div>

  <div class="auto-row">
    <input type="checkbox" id="autoCat" checked>
    <label for="autoCat">🎯 Smart Auto Category — ২৩ ক্যাটাগরি</label>
  </div>

  <div class="auto-row" style="background:rgba(156,39,176,.08);border-color:rgba(156,39,176,.25)">
    <input type="checkbox" id="autoImport" checked>
    <label for="autoImport" style="color:#9c27b0">⚡ Bulk Auto-Import — পেস্ট করলেই অটো শুরু</label>
  </div>

  <div class="auto-row" style="background:rgba(0,242,234,.08);border-color:rgba(0,242,234,.25)">
    <input type="checkbox" id="dupCheck" checked>
    <label for="dupCheck" style="color:#00f2ea">🔍 Duplicate Detection</label>
  </div>

  <label style="margin-top:14px">Default Category</label>
  <input id="cat" type="text" placeholder="Trending" value="Trending">

  <div class="btn-row">
    <button class="b-main" id="go" onclick="run()">🚀 Import / Discover</button>
    <button class="b-alt" onclick="clearAll()">🗑️ Clear</button>
    <button class="b-alt" onclick="clearHistory()">🧹 History</button>
  </div>

  <div class="status" id="st">
    <span id="stx">প্রসেস হচ্ছে...</span>
    <div class="bar"><div class="fill" id="fl"></div></div>
  </div>

  <div class="stat-row">
    <span>মোট: <b id="stTotal">0</b></span>
    <span>সফল: <b id="stOk">0</b></span>
    <span>স্কিপ: <b id="stSkip">0</b></span>
    <span>এরর: <b id="stErr">0</b></span>
    <span>⚡ রেট: <b id="stRate">0/s</b></span>
  </div>
</div>

<div class="box out" id="out">
  <h2>📤 আউটপুট</h2>
  <pre id="res"></pre>
  <div class="btn-row">
    <button class="b-alt" onclick="copyAll()">📋 Copy All</button>
    <button class="b-alt" onclick="downloadTXT()">⬇️ .txt</button>
    <button class="b-alt" onclick="downloadCSV()">📊 .csv</button>
    <button class="b-green" onclick="copyForSheets()">🟢 Copy for Sheets</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';
  var $inp = document.getElementById('inp');
  var $cat = document.getElementById('cat');
  var $autoCat = document.getElementById('autoCat');
  var $autoImport = document.getElementById('autoImport');
  var $dupCheck = document.getElementById('dupCheck');
  var $autoDiscover = document.getElementById('autoDiscover');
  var $speedMode = document.getElementById('speedMode');
  var $go = document.getElementById('go');
  var $st = document.getElementById('st');
  var $stx = document.getElementById('stx');
  var $fl = document.getElementById('fl');
  var $out = document.getElementById('out');
  var $res = document.getElementById('res');
  var $toast = document.getElementById('toast');
  var $stTotal = document.getElementById('stTotal');
  var $stOk = document.getElementById('stOk');
  var $stSkip = document.getElementById('stSkip');
  var $stErr = document.getElementById('stErr');
  var $stRate = document.getElementById('stRate');

  var HISTORY_KEY = 'tiktok_processed_urls';
  var MAX_HISTORY = 5000;
  var isRunning = false;
  var autoImportTimer = null;
  var audioCtx = null;

  function getSpeedConfig() {
    var mode = $speedMode ? $speedMode.value : 'normal';
    if (mode === 'safe') return { parallel: 1, delay: 500 };
    if (mode === 'fast') return { parallel: 5, delay: 50 };
    if (mode === 'turbo') return { parallel: 8, delay: 0 };
    return { parallel: 3, delay: 100 };
  }

  function stripHtml(s) {
    s = String(s || '');
    s = s.replace(/<a\s+[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi, '$1 $2');
    s = s.replace(/<[^>]+>/g, ' ');
    return s;
  }

  function extractUrls(text) {
    text = stripHtml(text);
    var found = [];
    var urlRe = /https?:\/\/[^\s<>"'\)\]\}]+/gi;
    var m;
    while ((m = urlRe.exec(text)) !== null) {
      var u = m[0].replace(/[.,;:!?\)\]\}"']+$/, '');
      if (/tiktok\.com/i.test(u)) found.push(u);
    }
    var bareRe = /(?:^|[\s\(\[\{>])((?:www\.|m\.|vt\.|vm\.|t\.)?tiktok\.com\/[^\s<>"'\)\]\}]+)/gi;
    var m2;
    while ((m2 = bareRe.exec(text)) !== null) {
      var b = m2[1].replace(/[.,;:!?\)\]\}"']+$/, '');
      found.push('https://' + b);
    }
    var seen = {}, result = [];
    for (var i = 0; i < found.length; i++) {
      if (!seen[found[i]]) { seen[found[i]] = 1; result.push(found[i]); }
    }
    return result;
  }

  function cleanUrlKey(input) {
    input = String(input || '').trim().toLowerCase();
    if (!input) return '';
    if (/^\d{15,25}$/.test(input)) return 'id:' + input;
    var shortM = input.match(/(?:vt|vm)\.tiktok\.com\/([a-z0-9]+)/i);
    if (shortM) return 'short:' + shortM[1];
    var vidM = input.match(/\/(?:video|v|photo)\/(\d+)/i);
    if (vidM) return 'vid:' + vidM[1];
    return 'other:' + input;
  }

  function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) { return []; } }
  function saveHistory(arr) { try { if(arr.length>MAX_HISTORY) arr=arr.slice(-MAX_HISTORY); localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); } catch(e) {} }
  function isDuplicate(url) { var key = cleanUrlKey(url); return key ? getHistory().indexOf(key) !== -1 : false; }
  function addToHistory(url) { var key = cleanUrlKey(url); if (!key) return; var h = getHistory(); if (h.indexOf(key) === -1) { h.push(key); saveHistory(h); } }
  
  window.clearHistory = function() {
    if (!confirm('Duplicate History মুছে ফেলবেন?')) return;
    try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
    toast('🧹 History cleared', false);
  };

  // ===== FIXED TOAST (Notification Error Solved) =====
  function toast(msg, isError) {
    $toast.textContent = msg;
    $toast.classList.toggle('error', !!isError);
    $toast.classList.add('show');
    setTimeout(function() { $toast.classList.remove('show'); }, 3500);
    
    try {
      if ('Notification' in window && Notification.permission === 'granted' && !isError) {
        new Notification('TikTok', { body: msg });
      }
    } catch(e) {
      // iOS বা যেসব ডিভাইসে Notification সাপোর্ট করে না, সেখানে চুপচাপ ইগনোর করবে
    }
  }

  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      o.start(); o.stop(audioCtx.currentTime + 0.3);
    } catch(e){}
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function extractId(url){
    var m = url.match(/\/(?:video|v|photo)\/(\d+)/i);
    return m ? m[1] : '';
  }
  function safeText(s) { s = String(s || '').replace(/\s+/g, ' ').replace(/\|/g, '/').trim(); return s || 'Untitled'; }

  async function callServer(url, action) {
    var res = await fetch('/api/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: url, action: action })
    });
    var j = await res.json();
    if (!res.ok || !j.success) throw new Error(j.error || ('এরর ' + res.status));
    return j.data;
  }

  async function processOne(url, useAuto, defaultCat) {
    try {
      var d = await callServer(url, 'extract');
      var category = useAuto ? (d.autoCategory || defaultCat) : defaultCat;
      return { ok: true, title: safeText(d.title), id: String(d.videoId || extractId(url) || ''), category: String(category || 'Trending').replace(/\|/g, '/'), thumb: d.thumbnailUrl || '' };
    } catch(e) { return { ok: false, error: e.message || 'ব্যর্থ' }; }
  }

  // ===== Main Run =====
  window.run = async function(){
    if (isRunning) return;
    var raw = ($inp.value || '').trim();
    if (!raw) return alert('⚠️ অনুগ্রহ করে কিছু TikTok লিংক দিন');

    var urls = extractUrls(raw);
    if (!urls.length) return alert('⚠️ কোনো TikTok লিংক পাওয়া যায়নি।');

    if ($autoDiscover.checked && urls.length > 1) {
      urls = [urls[0]]; 
      toast('ℹ️ Discover মোডে শুধুমাত্র প্রথম লিংকটি প্রসেস করা হবে।', false);
    }

    isRunning = true;
    $go.disabled = true;
    $st.classList.add('show');
    $out.classList.remove('show');
    $res.textContent = '';
    $fl.style.width = '0%';
    $stOk.textContent = '0'; $stSkip.textContent = '0'; $stErr.textContent = '0'; $stRate.textContent = '0/s';

    // ⭐⭐ Discover Mode Logic ⭐⭐
    if ($autoDiscover.checked) {
      $stx.textContent = '🔍 রিলেটেড ভিডিও (১০০+) খোঁজা হচ্ছে...';
      $fl.style.width = '50%'; 
      $stTotal.textContent = '1'; 
      
      try {
        var targetUrl = urls[0]; 
        var d = await callServer(targetUrl, 'discover');
        
        if (!d.relatedLinks || d.relatedLinks.length === 0) {
          $res.textContent = 'দুঃখিত, এই ভিডিওর সাথে সম্পর্কিত আর কোনো ভিডিও পাওয়া যায়নি।';
        } else {
          $res.textContent = '✅ ' + d.relatedLinks.length + ' টি আসল ভিডিও পাওয়া গেছে:\n\n' + d.relatedLinks.join('\n');
        }
        
        $fl.style.width = '100%';
        $stOk.textContent = d.relatedLinks.length;
        toast('✅ Discover সম্পন্ন! ' + d.relatedLinks.length + ' টি ভিডিও পাওয়া গেছে।', false);
        beep();
      } catch (e) {
        toast('❌ এরর: ' + e.message, true);
        $res.textContent = 'ERROR: ' + e.message;
      } finally {
        $st.classList.remove('show');
        $go.disabled = false;
        $out.classList.add('show');
        isRunning = false;
        try { $out.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e){}
      }
      return; 
    }

    // ⭐⭐ Normal Bulk Mode Logic (Turbo) ⭐⭐
    var useAuto = $autoCat.checked;
    var useDup = $dupCheck.checked;
    var defaultCat = ($cat.value || '').trim() || 'Trending';
    var cfg = getSpeedConfig();
    var countTotal = urls.length;
    var outArray = new Array(urls.length);
    var countOk = 0, countSkip = 0, countErr = 0, completed = 0;
    var startTime = Date.now();

    $stTotal.textContent = countTotal;

    function updateProgress() {
      completed++;
      $fl.style.width = Math.round((completed / countTotal) * 100) + '%';
      $stx.textContent = 'প্রসেস হচ্ছে ' + completed + '/' + countTotal + ' (⚡ ' + cfg.parallel + 'x)';
      $stOk.textContent = countOk; $stSkip.textContent = countSkip; $stErr.textContent = countErr;
      var elapsed = (Date.now() - startTime) / 1000;
      if (elapsed > 0.5) $stRate.textContent = (completed / elapsed).toFixed(1) + '/s';
    }

    async function worker(idx) {
      var url = urls[idx];
      try {
        if (useDup && isDuplicate(url)) {
          outArray[idx] = 'SKIP | ' + url + ' | (duplicate)'; countSkip++; updateProgress(); return;
        }
        var r = await processOne(url, useAuto, defaultCat);
        if (r && r.ok) {
          outArray[idx] = r.title + ' | ' + r.id + ' | ' + r.category + ' | ' + r.thumb;
          countOk++; addToHistory(url);
        } else {
          outArray[idx] = 'ERROR | ' + url + ' | ' + defaultCat + ' | ' + ((r && r.error) || 'ব্যর্থ');
          countErr++;
        }
      } catch(e) {
        outArray[idx] = 'ERROR | ' + url + ' | ' + defaultCat + ' | ' + (e.message || 'worker error');
        countErr++;
      }
      updateProgress();
    }

    try {
      for (var i = 0; i < urls.length; i += cfg.parallel) {
        var batch = [];
        for (var j = i; j < Math.min(i + cfg.parallel, urls.length); j++) batch.push(worker(j));
        await Promise.all(batch);
        if (cfg.delay > 0 && i + cfg.parallel < urls.length) await sleep(cfg.delay);
      }
    } catch(e) {}

    var out = [];
    for (var k = 0; k < outArray.length; k++) if (outArray[k]) out.push(outArray[k]);

    $res.textContent = out.join('\n');
    $st.classList.remove('show');
    $go.disabled = false;
    $out.classList.add('show');
    $fl.style.width = '100%';
    isRunning = false;
    try { $out.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e){}
    toast('✅ শেষ! সফল: ' + countOk + ' | এরর: ' + countErr, false);
    beep();
  };

  $inp.addEventListener('paste', function() {
    if (!$autoImport.checked) return;
    if ($autoDiscover.checked) return;
    if (autoImportTimer) clearTimeout(autoImportTimer);
    autoImportTimer = setTimeout(function() {
      if (($inp.value || '').trim() && !isRunning) run();
    }, 1200);
  });

  window.clearAll = function() {
    $inp.value = ''; $out.classList.remove('show'); $res.textContent = ''; $fl.style.width = '0%';
    $stTotal.textContent = '0'; $stOk.textContent = '0'; $stSkip.textContent = '0'; $stErr.textContent = '0'; $stRate.textContent = '0/s';
  };

  function fallbackCopy(text, cb) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      if (cb) cb(true);
    } catch (e) { if (cb) cb(false); }
  }

  window.copyAll = function() {
    var t = $res.textContent || '';
    if (!t) return toast('কিছু নেই', true);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function() { toast('📋 Copied!'); }).catch(function() { fallbackCopy(t, function(ok) { toast(ok ? '📋 Copied!' : '❌ Failed', !ok); }); });
    } else fallbackCopy(t, function(ok) { toast(ok ? '📋 Copied!' : '❌ Failed', !ok); });
  };

  window.copyForSheets = function() {
    var rows = ($res.textContent || '').split('\n').filter(function(l) { return l.trim(); });
    if (!rows.length) return toast('কিছু নেই', true);
    var tsv = rows.map(function(line) {
      if (line.indexOf('https://') === 0) return line; 
      var parts = line.split('|').map(function(p) { return p.trim(); });
      if (parts[0] === 'ERROR' || parts[0] === 'SKIP') return line;
      return parts.join('\t');
    }).join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tsv).then(function() { toast('🟢 Sheets-এর জন্য copied!'); }).catch(function() { fallbackCopy(tsv, function(ok) { toast(ok ? '🟢 Copied!' : '❌ Failed', !ok); }); });
    } else fallbackCopy(tsv, function(ok) { toast(ok ? '🟢 Copied!' : '❌ Failed', !ok); });
  };

  function csvEscape(p) {
    p = String(p || '');
    if (p.indexOf(',') !== -1 || p.indexOf('"') !== -1 || p.indexOf('\n') !== -1 || p.indexOf('\r') !== -1) return '"' + p.replace(/"/g, '""') + '"';
    return p;
  }

  window.downloadTXT = function() {
    var t = $res.textContent || ''; if (!t) return toast('কিছু নেই', true);
    try {
      var b = new Blob([t], { type: 'text/plain;charset=utf-8' }); var u = URL.createObjectURL(b); var a = document.createElement('a');
      a.href = u; a.download = 'tiktok-output-' + Date.now() + '.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(u); }, 1000); toast('⬇️ Downloaded!');
    } catch (e) { toast('❌ Failed', true); }
  };

  window.downloadCSV = function() {
    var rows = ($res.textContent || '').split('\n').filter(function(l) { return l.trim(); }); if (!rows.length) return toast('কিছু নেই', true);
    if ($autoDiscover.checked) {
      var csvLines = rows.map(function(line){ return csvEscape(line); }).join('\n');
      try {
        var b = new Blob(['\ufeffLink\n' + csvLines], { type: 'text/csv;charset=utf-8' }); var u = URL.createObjectURL(b); var a = document.createElement('a');
        a.href = u; a.download = 'tiktok-discover-links-' + Date.now() + '.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(u); }, 1000); toast('📊 CSV Downloaded!');
      } catch(e) { toast('❌ Failed', true); }
      return;
    }
    var header = 'Title,TikTok ID,Category,Thumbnail URL\n';
    var csv = rows.map(function(line) {
      var parts = line.split('|').map(function(p) { return p.trim(); });
      return parts.map(csvEscape).join(',');
    }).join('\n');
    try {
      var b = new Blob(['\ufeff' + header + csv], { type: 'text/csv;charset=utf-8' }); var u = URL.createObjectURL(b); var a = document.createElement('a');
      a.href = u; a.download = 'tiktok-output-' + Date.now() + '.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(u); }, 1000); toast('📊 CSV Downloaded!');
    } catch (e) { toast('❌ Failed', true); }
  };

})();
</script>
